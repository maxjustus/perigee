name: Ensemble
options:
  bundleIdPrefix: dev.ensemble
  deploymentTarget:
    macOS: "12.0"
targets:
  EnsembleHost:
    type: application
    platform: macOS
    sources: [EnsembleHost]
    dependencies:
      - target: EnsembleDriver
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ensemble.Host
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: EnsembleHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: EnsembleHost/EnsembleHost.entitlements
  EnsembleDriver:
    type: driver-extension
    platform: macOS
    sources: [EnsembleDriver]
    settings:
      base:
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "21.0"
        MACOSX_DEPLOYMENT_TARGET: ""
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        WARNING_CFLAGS: -Wall -Wextra -Wconversion -Wsign-conversion -Wshadow -Wimplicit-fallthrough -Wno-unused-parameter
        RUN_CLANG_STATIC_ANALYZER: YES
        CLANG_STATIC_ANALYZER_MODE: deep
        CLANG_ANALYZER_OTHER_FLAGS: -analyzer-werror
        OTHER_LDFLAGS: -framework DriverKit -framework PCIDriverKit -framework AudioDriverKit
        PRODUCT_BUNDLE_IDENTIFIER: dev.ensemble.Host.Driver
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: EnsembleDriver/Info.plist
        CODE_SIGN_ENTITLEMENTS: EnsembleDriver/EnsembleDriver.entitlements
