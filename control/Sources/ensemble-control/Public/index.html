<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ensemble</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #15171a; color: #e6e6e6; }
  header { display: flex; gap: 12px; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: #9aa0a6; }
  #status.live { color: #6fcf97; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  section { background: #1f2226; border-radius: 8px; padding: 12px; }
  h2 { font-size: 13px; margin: 0 0 8px; color: #9aa0a6; text-transform: uppercase; letter-spacing: .04em; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin: 6px 0; }
  input[type=range] { grid-column: 1 / -1; width: 100%; }
  output { font-variant-numeric: tabular-nums; color: #c9d1d9; }
  #meters { margin-bottom: 12px; }
  .bank { display: flex; gap: 2px; height: 90px; margin-bottom: 18px; }
  .meter { flex: 1; position: relative; background: #2a2e33; border-radius: 2px; }
  .fill { position: absolute; bottom: 0; width: 100%; background: #6fcf97; border-radius: 2px; }
  .fill.hot { background: #f2c94c; }
  .fill.clip { background: #eb5757; }
  .meter span { position: absolute; top: 100%; width: 100%; font-size: 8px; text-align: center;
                color: #9aa0a6; overflow: hidden; white-space: nowrap; }
  #mixers { margin-bottom: 12px; }
  #mixer-tabs button { margin-left: 6px; background: #2a2e33; color: inherit; border: 1px solid #3a3f45;
                       border-radius: 4px; padding: 2px 8px; }
  #mixer-tabs button.shown { background: #3d6b55; }
  .strips { display: none; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
  .strips.shown { display: flex; }
  .strip { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 52px;
           background: #262a2f; border-radius: 4px; padding: 6px 2px; font-size: 10px; }
  .strip span { white-space: nowrap; color: #c9d1d9; }
  .fader { writing-mode: vertical-lr; direction: rtl; height: 140px; width: 22px; margin: 0; }
  .pan { width: 46px; margin: 0; }
  .strip label.mute { display: flex; gap: 2px; margin: 0; }
  select { background: #2a2e33; color: inherit; border: 1px solid #3a3f45; border-radius: 4px; }
</style>
</head>
<body>
<header><h1>Ensemble</h1><span id="status">connecting</span></header>
<section id="meters"></section>
<section id="mixers"><h2>Mixers <span id="mixer-tabs"></span></h2></section>
<main id="groups"></main>
<script>
const controls = new Map();
const pending = new Map();
let socket, nextId = 1;

function rpc(method, params) {
  const id = nextId++;
  socket.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

function show(path, value) {
  const control = controls.get(path);
  if (control) control.update(value);
}

function group(path) {
  const id = path.slice(0, path.lastIndexOf("/"));
  let section = document.getElementById(id);
  if (!section) {
    section = document.createElement("section");
    section.id = id;
    section.innerHTML = `<h2>${id.replaceAll("/", " · ")}</h2>`;
    document.getElementById("groups").append(section);
  }
  return section;
}

function slider(path, min, max, format) {
  const output = document.createElement("output");
  const input = Object.assign(document.createElement("input"), { type: "range", min, max });
  let queued = false;
  input.oninput = () => {
    output.value = format(input.value);
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      rpc("set", { [path]: Number(input.value) });
    });
  };
  controls.set(path, { update: value => {
    if (document.activeElement !== input) input.value = value;
    output.value = format(value);
  } });
  return [output, input];
}

function toggle(path) {
  const input = Object.assign(document.createElement("input"), { type: "checkbox" });
  input.onchange = () => rpc("set", { [path]: input.checked });
  controls.set(path, { update: value => { input.checked = value; } });
  return input;
}

function picker(path, choices) {
  const input = document.createElement("select");
  input.append(...choices.map(choice => new Option(choice, choice)));
  input.onchange = () => rpc("set", { [path]: input.value });
  controls.set(path, { update: value => { input.value = value; } });
  return input;
}

function render(parameter) {
  const strip = parameter.path.match(/^mixers\/(\d+)\/channels\/(\d+)\/(\w+)$/);
  if (strip) return renderStrip(parameter, Number(strip[1]), Number(strip[2]), strip[3]);
  const name = parameter.path.slice(parameter.path.lastIndexOf("/") + 1);
  const label = document.createElement("label");
  label.append(name);
  if (parameter.kind === "bool") {
    label.append(toggle(parameter.path));
  } else if (parameter.kind === "choice") {
    label.append(picker(parameter.path, parameter.choices));
  } else {
    const format = name === "attenuation" ? v => `-${v} dB`
      : name === "trim" ? v => `-${(v / 10).toFixed(1)} dB`
      : /gain$/i.test(name) ? v => `${v} dB` : v => `${v}`;
    label.append(...slider(parameter.path, parameter.min, parameter.max, format));
  }
  group(parameter.path).append(label);
}

const formatFader = v => Number(v) === 0 ? "-∞" : ((v - 600) / 10).toFixed(1);
const formatPan = v => Number(v) === 64 ? "C" : v < 64 ? `L${64 - v}` : `R${v - 64}`;

function mixer(number) {
  let strips = document.getElementById(`mixer-${number}`);
  if (!strips) {
    const tab = Object.assign(document.createElement("button"), { textContent: `Mix ${number}` });
    tab.onclick = () => showMixer(number);
    document.getElementById("mixer-tabs").append(tab);
    strips = Object.assign(document.createElement("div"), { id: `mixer-${number}`, className: "strips" });
    document.getElementById("mixers").append(strips);
    if (number === 1) showMixer(1);
  }
  return strips;
}

function showMixer(number) {
  document.querySelectorAll(".strips").forEach(s => s.classList.toggle("shown", s.id === `mixer-${number}`));
  document.querySelectorAll("#mixer-tabs button").forEach((b, i) => b.classList.toggle("shown", i + 1 === number));
}

function renderStrip(parameter, number, channel, control) {
  let strip = document.getElementById(`mixer-${number}-${channel}`);
  if (!strip) {
    strip = Object.assign(document.createElement("div"), { id: `mixer-${number}-${channel}`, className: "strip" });
    strip.append(Object.assign(document.createElement("span"), { textContent: channelNames[channel - 1] }));
    mixer(number).append(strip);
  }
  if (control === "fader") {
    const [output, input] = slider(parameter.path, parameter.min, parameter.max, formatFader);
    input.className = "fader";
    strip.append(output, input);
  } else if (control === "pan") {
    const [output, input] = slider(parameter.path, parameter.min, parameter.max, formatPan);
    input.className = "pan";
    strip.append(input, output);
  } else {
    const label = Object.assign(document.createElement("label"), { className: "mute" });
    label.append(toggle(parameter.path), { mute: "M", solo: "S", soloSafe: "SS" }[control]);
    strip.append(label);
  }
}

const meterNames = {
  inputs: [...[1, 2, 3, 4, 5, 6, 7, 8].map(n => `A${n}`), "Mic L", "Mic R", "Gtr 1", "Gtr 2",
           "SPDIF L", "SPDIF R", ...Array.from({ length: 16 }, (_, i) => `Opt ${i + 1}`)],
  outputs: [...Array.from({ length: 10 }, (_, i) => `Line ${i + 1}`), "Gtr Out 1", "Gtr Out 2",
            "SPDIF L", "SPDIF R", ...Array.from({ length: 16 }, (_, i) => `Opt ${i + 1}`)],
  outputGroup: ["HP1 L", "HP1 R", "HP2 L", "HP2 R"],
  mixers: [1, 2, 3, 4].flatMap(n => [`Mix ${n} L`, `Mix ${n} R`]),
};
const channelNames = [...meterNames.inputs, ...Array.from({ length: 16 }, (_, i) => `Play ${i + 1}`),
                      "Master L", "Master R"];
const meterFills = {};

for (const [key, names] of Object.entries(meterNames)) {
  const bank = document.createElement("div");
  bank.className = "bank";
  meterFills[key] = names.map(name => {
    const meter = document.createElement("div");
    meter.className = "meter";
    meter.title = name;
    const fill = document.createElement("div");
    fill.className = "fill";
    meter.append(fill, Object.assign(document.createElement("span"), { textContent: name }));
    bank.append(meter);
    return fill;
  });
  document.getElementById("meters").append(bank);
}

function showMeters(meters) {
  for (const [key, fills] of Object.entries(meterFills)) {
    meters[key].forEach((value, i) => {
      const db = 20 * Math.log10(Math.max(value, 1) / 16384);
      fills[i].style.height = `${Math.min(100, Math.max(0, (db + 60) / 60 * 100))}%`;
      fills[i].className = db > -1 ? "fill clip" : db > -6 ? "fill hot" : "fill";
    });
  }
}

function connect() {
  const status = document.getElementById("status");
  socket = new WebSocket(`ws://${location.hostname}:8738`);
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.id && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      message.error ? reject(message.error) : resolve(message.result);
    } else if (message.method === "meters") {
      showMeters(message.params);
    } else if (message.method === "changed") {
      for (const [path, value] of Object.entries(message.params)) show(path, value);
    }
  };
  socket.onopen = async () => {
    status.textContent = "connected";
    status.className = "live";
    if (controls.size === 0) (await rpc("describe")).forEach(render);
    for (const [path, value] of Object.entries(await rpc("get"))) show(path, value);
  };
  socket.onclose = () => {
    status.textContent = "reconnecting";
    status.className = "";
    setTimeout(connect, 1000);
  };
}

connect();
</script>
</body>
</html>
